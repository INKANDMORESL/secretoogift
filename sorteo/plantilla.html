<style>
/*FUENTES*/
:root{
  --bg:#f5f8ff; --card:#ffffff; --ink:#14213d; --muted:#5f6b85; --line:#e2e8f4;
  --green:#0b3a7a; --green2:#1a56b8; --red:#1a56b8; --gold:#ffc20e; --soft:#edf2fd;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px}
body{min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{max-width:520px;margin:0 auto;padding:18px 18px 110px}
h1,h2,h3{font-family:"Bricolage Grotesque",Inter,sans-serif;margin:0;letter-spacing:-.02em}
h1{font-size:34px;font-weight:800;line-height:1.02}
h2{font-size:24px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.top{display:flex;align-items:center;gap:10px;margin:6px 0 18px}
.back{border:0;background:var(--soft);width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;color:var(--ink);flex:none}
.hero{background:var(--green);color:#f6f1e7;border-radius:26px;padding:26px 22px 22px;position:relative;overflow:hidden;margin-bottom:18px}
.hero h1{color:#fff}
.hero p{color:#dbe5ff;margin-top:10px;padding-right:70px;position:relative;line-height:1.45}
.hero svg{position:absolute;right:-18px;top:-10px;opacity:.95}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.btn{appearance:none;border:0;border-radius:14px;padding:15px 18px;font:600 16px Inter,sans-serif;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--gold);color:var(--ink);box-shadow:0 4px 14px rgba(255,199,44,.4)}
.btn.dark{background:var(--green);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:10px 14px;font-size:14px;width:auto;border-radius:12px}
.row{display:flex;gap:10px;align-items:center}
.stack>*+*{margin-top:10px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
input,select{width:100%;font:500 16px Inter,sans-serif;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
/* La fecha en iPhone: mismo alto y ancho que el resto, sin salirse de la tarjeta */
.grid2>*{min-width:0}
input{min-width:0;max-width:100%;height:50px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left;line-height:normal}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{margin:0}
input:focus,select:focus{border-color:var(--green2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:7px 8px 7px 12px;font-size:14.5px;font-weight:500;margin:0 6px 8px 0}
.chip button{border:0;background:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:13px;line-height:22px;padding:0;color:var(--muted)}
.group-item{display:flex;align-items:center;gap:14px;cursor:pointer}
.badge{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.badge.ok{background:#dcefe3;color:var(--green2)}
.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:700 18px "Bricolage Grotesque";color:#fff;flex:none}
.person{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;width:100%;font:inherit;color:inherit;text-align:left;margin-bottom:8px}
.person .name{font-weight:600;flex:1}
.person.seen{opacity:.55}
.tabs{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:11px;font:600 14px Inter;cursor:pointer;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.reveal{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.gift{width:220px;height:220px;cursor:pointer;transition:transform .2s}
.gift:active{transform:scale(.96)}
.result{background:var(--green);color:#fff;border-radius:26px;padding:30px 22px;width:100%;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.result .to{font:800 42px "Bricolage Grotesque";margin:8px 0 6px;color:#fff;word-break:break-word}
.result .meta{color:#dbe5ff;font-size:14.5px}
.result .to{color:var(--gold)!important}
.steps{display:flex;gap:8px;margin:0 0 16px}
.steps div{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;font-size:13px;font-weight:600}
.steps span{display:block;font-size:22px;margin-bottom:4px}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.codebox{font:600 13px ui-monospace,Menlo,monospace;background:var(--soft);border-radius:12px;padding:12px;word-break:break-all;user-select:all}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14.5px;transition:transform .25s;z-index:50;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.modal-bg{position:fixed;inset:0;background:rgba(20,20,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:16px}
.modal{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:480px;margin-bottom:env(safe-area-inset-bottom)}
.modal h3{margin-bottom:8px}
.modal .row{margin-top:18px}
.list-res{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-weight:500}
.list-res:last-child{border:0}
.err{color:var(--red);font-size:14px;font-weight:600;margin-top:10px}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.sticky .inner{max-width:520px;margin:0 auto}
.snow{position:absolute;inset:0;pointer-events:none}
.feat{display:flex;gap:12px;align-items:center;background:#fff8e1;border:1px solid #ffe8a3;border-radius:16px;padding:14px 16px;margin-bottom:10px;font-size:16px;color:var(--ink)}
.feat b{color:var(--green)}
.feat .ck{color:var(--green2);font-weight:800;font-size:18px}
.buy{position:relative;display:flex;align-items:stretch;border:0;padding:0;-webkit-appearance:none;appearance:none;border-radius:22px;overflow:hidden;width:100%;cursor:pointer;background:var(--green2);color:#fff;font:700 21px "Bricolage Grotesque";box-shadow:0 8px 20px rgba(47,91,234,.3);margin-top:22px}
.buy .l{flex:1;padding:20px;text-align:left}
.buy .r{flex:none;margin-right:-1px;background:var(--gold);color:var(--ink);padding:20px 22px;display:flex;align-items:center;font-size:22px}
.nothanks{display:block;margin:16px auto 0;border:0;background:none;color:var(--muted);font:700 13px Inter;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:10px}
.ad{border:1.5px dashed #d8cfbd;border-radius:14px;padding:14px;text-align:center;color:var(--muted);font-size:13px;margin:14px 0;background:#fbf8f1}
.ad b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px}
.prem{background:linear-gradient(135deg,#fff9e6,#fff0c2);border-color:#ffe08a}
.crown{color:#b8860b}
.lockrow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14.5px;padding:5px 0}
.hero-head{display:flex;align-items:center;gap:14px;margin-top:14px}
.hero-logo{width:84px;height:84px;border-radius:50%;flex:none;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.hero p{padding-right:0!important}
.langsel{position:absolute;right:14px;top:14px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:5px 11px;font:600 13px Inter;z-index:2}
.langsel select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.gift{width:220px!important;height:220px!important;border-radius:50%;box-shadow:0 10px 30px rgba(11,58,122,.25);animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-6deg)}90%{transform:rotate(6deg)}95%{transform:rotate(-3deg)}}
.stat{font:800 24px "Bricolage Grotesque"}
.stack>input+input{margin-top:8px}
.kicker{color:var(--gold);font:700 13px Inter;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.hero h1{font-size:31px}
.btn.wa{background:#25d366;color:#fff}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.qc{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font:600 13.5px Inter;color:var(--ink);cursor:pointer}
.qc.on{background:var(--green);border-color:var(--green);color:#fff}
