@font-face{font-family:Inter;src:url(fonts/inter-400.woff) format('woff');font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(fonts/inter-600.woff) format('woff');font-weight:600 700;font-display:swap}
@font-face{font-family:InterDisplay;src:url(fonts/interdisplay-800.woff) format('woff');font-weight:800;font-display:swap}
:root{--navy:#0b3a7a;--blue:#1a56b8;--gold:#ffc20e;--ink:#14213d;--muted:#5f6b85;--bg:#f5f8ff;--line:#e2e8f4;--soft:#edf2fd}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:InterDisplay,Inter,system-ui,sans-serif;font-weight:800;letter-spacing:-.025em;margin:0}
p{margin:0}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}

/* Cabecera */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(226,232,244,.7)}
.nav{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font:800 21px InterDisplay,Inter,sans-serif;letter-spacing:-.02em;text-decoration:none;color:var(--navy)}
.brand img{width:38px;height:38px;border-radius:50%}
.nav .sp{flex:1}
.lang{position:relative;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;font:600 13.5px Inter;cursor:pointer;background:#fff}
.lang select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.navbtn{background:var(--navy);color:#fff;text-decoration:none;font:600 14px Inter;padding:10px 16px;border-radius:999px;white-space:nowrap}

/* Hero */
.hero{background:radial-gradient(1200px 600px at 85% -10%,#1a56b8 0%,#0b3a7a 55%,#082c5e 100%);color:#fff;overflow:hidden;position:relative}
.hero .wrap{display:grid;grid-template-columns:1fr;gap:40px;padding-top:54px;padding-bottom:0}
.kicker{display:inline-flex;align-items:center;gap:8px;background:rgba(255,194,14,.14);color:var(--gold);font:700 12.5px Inter;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border-radius:999px}
.hero h1{font-size:clamp(40px,8vw,68px);line-height:.98;margin:18px 0 18px}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .sub{font-size:clamp(17px,2.2vw,20px);line-height:1.5;color:#d6e2ff;max-width:520px}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:30px}
.store{display:inline-flex;align-items:center;gap:12px;background:#000;color:#fff;text-decoration:none;border-radius:14px;padding:11px 22px 11px 16px;border:1.5px solid rgba(255,255,255,.25);transition:transform .15s}
.store:hover{transform:translateY(-2px)}
.store .ic{width:30px;height:30px;display:grid;place-items:center;background:var(--gold);color:var(--navy);border-radius:9px;font-weight:800;font-size:17px}
.store small{display:block;font-size:11.5px;opacity:.85;line-height:1.1}
.store b{display:block;font:700 21px InterDisplay,Inter,sans-serif;letter-spacing:-.01em;line-height:1.1}
.note{color:#b9c9ee;font-size:14px}
.phones{position:relative;height:500px;max-width:420px;margin:0 auto;width:100%}
.phone{position:absolute;width:230px;aspect-ratio:390/844;border-radius:38px;background:#0a0f1e;padding:9px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:30px;display:block;background:#f5f8ff}
.phone::before{content:"";position:absolute;top:16px;left:50%;transform:translateX(-50%);width:70px;height:20px;background:#0a0f1e;border-radius:12px;z-index:2}
.phone.a{left:0;top:30px;transform:rotate(-6deg)}
.phone.b{right:0;top:0;transform:rotate(5deg);z-index:2}

/* Secciones */
section{padding:84px 0}
.eyebrow{color:var(--blue);font:700 13px Inter;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
h2{font-size:clamp(30px,5vw,44px);line-height:1.05;max-width:640px}
.lead{color:var(--muted);font-size:18px;line-height:1.55;margin-top:14px;max-width:600px}

.steps{display:grid;grid-template-columns:1fr;gap:16px;margin-top:40px}
.step{background:var(--bg);border-radius:24px;padding:26px}
.step .n{width:44px;height:44px;border-radius:14px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font:800 20px InterDisplay,Inter;margin-bottom:16px}
.step h3{font-size:21px;margin-bottom:6px}
.step p{color:var(--muted);line-height:1.5}

.feat-wrap{display:grid;grid-template-columns:1fr;gap:40px;align-items:center}
.feats{display:grid;grid-template-columns:1fr;gap:12px;margin-top:30px}
.f{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:18px;background:#fff}
.f .e{font-size:24px;line-height:1;width:44px;height:44px;border-radius:13px;background:var(--soft);display:grid;place-items:center;flex:none}
.f h3{font-size:17px;font-family:Inter;font-weight:700;letter-spacing:-.01em;margin-bottom:3px}
.f p{color:var(--muted);font-size:15px;line-height:1.45}
.f .tag{display:inline-block;margin-left:6px;font:700 10.5px Inter;letter-spacing:.06em;text-transform:uppercase;background:#fff3c4;color:#8a6500;padding:3px 7px;border-radius:999px;vertical-align:2px}
.single{position:relative;height:520px;display:flex;justify-content:center}
.single .phone{position:relative;width:250px;transform:rotate(-3deg)}

.bg{background:var(--bg)}
.plans{display:grid;grid-template-columns:1fr;gap:16px;margin-top:40px}
.plan{background:#fff;border:1px solid var(--line);border-radius:26px;padding:28px}
.plan.pro{background:var(--navy);color:#fff;border:0;position:relative;overflow:hidden}
.plan.pro::after{content:"👑";position:absolute;right:22px;top:20px;font-size:34px}
.plan h3{font-size:22px}
.price{font:800 44px InterDisplay,Inter;letter-spacing:-.03em;margin:12px 0 2px}
.plan .per{color:var(--muted);font-size:14.5px}
.plan.pro .per{color:#c2d3f7}
.plan ul{list-style:none;padding:0;margin:22px 0 0}
.plan li{padding:9px 0;border-top:1px solid var(--line);display:flex;gap:10px;font-size:15.5px}
.plan.pro li{border-color:rgba(255,255,255,.14)}
.plan li::before{content:"✓";font-weight:800;color:var(--blue)}
.plan.pro li::before{color:var(--gold)}

.faq{margin-top:34px;max-width:760px}
details{border-bottom:1px solid var(--line);padding:4px 0}
summary{cursor:pointer;list-style:none;font:700 18px Inter;letter-spacing:-.01em;padding:18px 36px 18px 0;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:4px;top:12px;font-size:26px;font-weight:400;color:var(--blue);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details p{color:var(--muted);line-height:1.6;padding:0 0 20px;font-size:16px}

.final{background:var(--gold);border-radius:32px;padding:44px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.final img{width:96px;height:96px;border-radius:50%;box-shadow:0 10px 26px rgba(11,58,122,.25)}
.final h2{color:var(--navy);margin:0 auto}
.final p{color:#5a4600;font-size:17px}
.final .store{border-color:transparent}

footer{padding:40px 0 calc(40px + env(safe-area-inset-bottom));color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center}
footer .sp{flex:1}
footer a{text-decoration:none}
footer a:hover{text-decoration:underline}

@media (min-width:860px){
  .hero .wrap{grid-template-columns:1.1fr .9fr;align-items:center;padding-top:70px;padding-bottom:60px}
  .phones{height:560px;margin:0}
  .phone{width:250px}
  .steps{grid-template-columns:repeat(3,1fr)}
  .feat-wrap{grid-template-columns:1fr 1fr}
  .feats{grid-template-columns:1fr 1fr}
  .plans{grid-template-columns:1fr 1fr;max-width:820px}
  .final{padding:60px}
}
@media (max-width:420px){.navbtn{display:none}.phone{width:200px}.phones{height:440px}}
</style>

const LANGS=Object.keys(T);
let L=(()=>{try{const s=localStorage.getItem('sg-lang');if(T[s])return s}catch(e){}
  return (navigator.languages||[navigator.language||'en']).map(x=>String(x).slice(0,2).toLowerCase()).find(x=>T[x])||'en'})();
const money=(v,dec=2)=>{try{return new Intl.NumberFormat(T[L]._l,{style:'currency',currency:'EUR',minimumFractionDigits:dec,maximumFractionDigits:dec}).format(v)}catch(e){return v+' €'}};
const price=()=>money(PRICE_EUR);
const fill=s=>s.replace('{max}',FREE_MAX).replace('{price}',price());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const d=T[L];document.documentElement.lang=L;
  document.title='Secretoogift · '+d.kind.replace('🎁 ','');
  document.querySelectorAll('[data-t]').forEach(el=>{const k=el.dataset.t==='badgeSmall'&&!APPSTORE_URL?'soon':el.dataset.t;const v=d[k];if(typeof v==='string')el.textContent=fill(v)});
  document.querySelectorAll('[data-th]').forEach(el=>el.innerHTML=d[el.dataset.th]);
  document.querySelectorAll('[data-shot]').forEach(el=>el.src='img/'+L+'_'+el.dataset.shot+'.webp');
  document.getElementById('feats').innerHTML=d.feats.map(f=>`<div class="f"><div class="e">${f[0]}</div><div><h3>${esc(f[1])}${f[3]?`<span class="tag">${d.premium}</span>`:''}</h3><p>${esc(f[2])}</p></div></div>`).join('');
  document.getElementById('freeList').innerHTML=d.freeList.map(x=>`<li>${esc(fill(x))}</li>`).join('');
  document.getElementById('premList').innerHTML=d.premList.map(x=>`<li>${esc(x)}</li>`).join('');
  document.getElementById('premPrice').textContent=price();
  document.querySelector('[data-t=freeP]').textContent=money(0,0);
  document.getElementById('faqList').innerHTML=d.faq.map((q,i)=>`<details ${i===0?'open':''}><summary>${esc(q[0])}</summary><p>${esc(fill(q[1]))}</p></details>`).join('');
  document.getElementById('langLbl').textContent=d._f+' '+L.toUpperCase();
  document.getElementById('langSel').innerHTML=LANGS.map(l=>`<option value="${l}" ${l===L?'selected':''}>${T[l]._f} ${T[l]._n}</option>`).join('');
}
document.getElementById('langSel').onchange=e=>{L=e.target.value;try{localStorage.setItem('sg-lang',L)}catch(x){}render()};
document.querySelectorAll('[data-store]').forEach(a=>{if(APPSTORE_URL){a.href=APPSTORE_URL;a.target='_blank';a.rel='noopener'}else{a.removeAttribute('href');a.style.cursor='default'}});
document.getElementById('yr').textContent=new Date().getFullYear();
const m=document.getElementById('mail');m.href='mailto:'+SUPPORT;m.textContent=SUPPORT;
render();
