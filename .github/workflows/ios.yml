# Prepara la app de iPhone en los servidores de Expo y la sube a TestFlight (App Store Connect).
# Se lanza a mano desde GitHub → Actions → «App iPhone» → Run workflow.
# Necesita en GitHub (Secrets): EXPO_TOKEN, ASC_API_KEY_P8 (texto del archivo .p8), ASC_KEY_ID, ASC_ISSUER_ID,
# APPLE_TEAM_ID (los mismos valores que en Yococino). En Variables: ASC_APP_ID (Apple ID numérico de la app en
# App Store Connect; sin él, la app se crea pero no se sube), DOMINIO, REVENUECAT_IOS_KEY, ADMOB_IOS_APP_ID y
# ADMOB_IOS_INTERSTITIAL (sin estos dos, anuncios de prueba). Con la clave de App Store Connect, Expo crea solo los certificados.
name: App iPhone

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: COMPANY_OR_ORGANIZATION
      # La sincronización automática de capacidades falla con la clave de API: se configuran a mano en Apple.
      EXPO_NO_CAPABILITY_SYNC: '1'
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar los datos de Apple y Expo
        run: |
          falta=""
          [ -z "$EXPO_TOKEN" ] && falta="$falta EXPO_TOKEN"
          [ -z "$ASC_API_KEY_P8" ] && falta="$falta ASC_API_KEY_P8"
          [ -z "$EXPO_ASC_KEY_ID" ] && falta="$falta ASC_KEY_ID"
          [ -z "$EXPO_ASC_ISSUER_ID" ] && falta="$falta ASC_ISSUER_ID"
          [ -z "$EXPO_APPLE_TEAM_ID" ] && falta="$falta APPLE_TEAM_ID"
          if [ -n "$falta" ]; then echo "::error title=App iPhone::Faltan en GitHub:$falta"; exit 1; fi
          # La clave .p8 se arregla si se pegó sin las líneas BEGIN/END o sin saltos de línea
          CUERPO=$(printf '%s' "$ASC_API_KEY_P8" | sed 's/\\n/\n/g' | grep -v -- '-----' | tr -d ' \r\n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; echo "$CUERPO" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$RUNNER_TEMP/asc.p8"
          if ! openssl pkey -in "$RUNNER_TEMP/asc.p8" -noout 2>/dev/null; then
            echo "::error title=Clave de Apple::El secreto ASC_API_KEY_P8 no es una clave .p8 válida. Abre el archivo .p8 con el Bloc de notas, copia TODO el texto y vuelve a guardarlo en GitHub."
            exit 1
          fi
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"

      - name: Página del sorteo dentro de la app
        working-directory: .
        env:
          DOMINIO: ${{ vars.DOMINIO }}
          EMAIL_SOPORTE: ${{ vars.EMAIL_SOPORTE }}
          APPSTORE_ID: ${{ vars.APPSTORE_ID }}
        run: node herramientas/construir.mjs app

      - name: Instalar dependencias
        run: |
          for intento in 1 2 3; do
            npm install --no-audit --no-fund > instalar.txt 2>&1 && exit 0
            sleep 15
          done
          cat instalar.txt | tail -n 30
          exit 1

      - name: Enlazar con el proyecto de Expo
        run: |
          npx --yes eas-cli@latest init --non-interactive --force

      - name: Claves de anuncios y pagos, y envío a TestFlight
        run: |
          ADMOB_APP="${{ vars.ADMOB_IOS_APP_ID }}"
          if [ -n "$ADMOB_APP" ]; then
            jq --arg id "$ADMOB_APP" '(.expo.plugins[] | select(type=="array" and .[0]=="react-native-google-mobile-ads") | .[1].iosAppId) = $id | .["react-native-google-mobile-ads"].ios_app_id = $id' app.json > app.tmp && mv app.tmp app.json
          else
            echo "::warning title=Anuncios::Sin ADMOB_IOS_APP_ID: la app lleva anuncios de prueba de Google (no se cobra nada)."
          fi
          [ -z "${{ vars.REVENUECAT_IOS_KEY }}" ] && echo "::warning title=Pagos::Sin REVENUECAT_IOS_KEY: el botón de pagar dirá que los pagos aún no están disponibles."
          jq --arg rc "${{ vars.REVENUECAT_IOS_KEY }}" --arg ad "${{ vars.ADMOB_IOS_INTERSTITIAL }}" \
             --arg p8 "$EXPO_ASC_API_KEY_PATH" --arg kid "$EXPO_ASC_KEY_ID" --arg iss "$EXPO_ASC_ISSUER_ID" --arg team "$EXPO_APPLE_TEAM_ID" --arg app "$ASC_APP_ID" \
            '.build.production.env = ({} + (if $rc != "" then {EXPO_PUBLIC_REVENUECAT_IOS_KEY: $rc} else {} end) + (if $ad != "" then {EXPO_PUBLIC_ADMOB_IOS_INTERSTITIAL: $ad} else {} end))
             | .submit.production.ios = ({ascApiKeyPath: $p8, ascApiKeyId: $kid, ascApiKeyIssuerId: $iss, appleTeamId: $team} + (if $app != "" then {ascAppId: $app} else {} end))' eas.json > eas.tmp && mv eas.tmp eas.json
          if [ -n "$ASC_APP_ID" ]; then echo "ENVIAR=--auto-submit" >> "$GITHUB_ENV"; else
            echo "ENVIAR=" >> "$GITHUB_ENV"
            echo "::warning title=TestFlight::Falta la variable ASC_APP_ID: la app se crea pero no se sube. Crea la app en App Store Connect (paquete app.secretoogift), pon su Apple ID en ASC_APP_ID y vuelve a lanzar."
          fi

      - name: Grupos de app que necesita (para configurarlos en Apple)
        run: |
          npx --yes expo prebuild --platform ios --no-install > prebuild.txt 2>&1 || true
          G=$(grep -rh -A4 "application-groups" ios 2>/dev/null | grep -o "group\.[A-Za-z0-9.-]*" | sort -u | tr '\n' ' ')
          echo "::notice title=Grupos de app::${G:-ninguno}"
          rm -rf ios

      - name: Crear la app de iPhone y subirla a TestFlight
        run: |
          if npx --yes eas-cli@latest build --platform ios --profile production --non-interactive $ENVIAR --wait > salida.txt 2>&1; then
            tail -n 20 salida.txt
            echo "::notice title=App iPhone::Creada y enviada a TestFlight. Apple tarda unos minutos en procesarla; luego aparece en App Store Connect → TestFlight."
            exit 0
          fi
          if ! grep -q "Credentials are not set up\|not validated for non-interactive" salida.txt; then
            cat salida.txt
            echo "::error title=App iPhone::$(grep -v '^\s*$' salida.txt | tail -n 14 | tr '\n' ' ' | cut -c1-1800)"
            exit 1
          fi
          # La primera vez Expo tiene que crear los certificados y perfiles de Apple y lo pregunta en pantalla:
          # se responde «sí» a todo con la clave de App Store Connect (sin usuario ni contraseña de Apple).
          echo "Primera vez: creando certificados de Apple…"
          sudo apt-get install -y expect > /dev/null
          cat > responder.exp <<'EXP'
          set timeout 240
          set respuestas 0
          log_user 1
          spawn env -u CI -u GITHUB_ACTIONS -u CONTINUOUS_INTEGRATION npx --yes eas-cli@latest build --platform ios --profile production {*}[split $env(ENVIAR)] --no-wait
          expect {
            -re {(?i)log in to your apple account\?} { send "n\r"; exp_continue }
            -re {Push Notifications} { send "\033\[B\r"; exp_continue }
            -re {(?i)apple id:} { send "\003"; exit 3 }
            -re {\(Y/n\)} { send "y\r"; exp_continue }
            -re {\(y/N\)} { send "y\r"; exp_continue }
            -re {(?i)select|choose|which} { incr respuestas; if {$respuestas > 40} { exit 5 }; send "\r"; exp_continue }
            timeout { puts "\n>>> Expo se ha quedado esperando sin preguntar nada reconocible."; exit 4 }
            eof
          }
          catch wait resultado
          exit [lindex $resultado 3]
          EXP
          sed -i 's/^          //' responder.exp
          if timeout 1500 expect responder.exp > salida2.txt 2>&1; then
            tail -n 30 salida2.txt
            echo "::notice title=App iPhone::Certificados creados y app enviada a Expo. Tarda unos 20-40 minutos en crearse y subirse a TestFlight."
          else
            tail -n 60 salida2.txt
            # Las últimas líneas, en trozos, para poder leerlas desde fuera (el registro completo no siempre se ve).
            sed 's/\x1b\[[0-9;?]*[A-Za-z]//g; s/\r/\n/g' salida2.txt | grep -v '^\s*$' | tail -n 70 > limpio.txt
            split -l 9 limpio.txt trozo_
            for f in trozo_*; do echo "::warning title=iPhone ($f)::$(tr '\n' ' ' < $f | cut -c1-900)"; done
            echo "::error title=App iPhone::No se ha podido crear la primera versión de iPhone."
            exit 1
          fi
